name: Deploy Barwa Discount Checker

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare site and configure Scandit
        env:
          SCANDIT_LICENSE_KEY: ${{ secrets.SCANDIT_LICENSE_KEY }}
        run: |
          if [ -z "$SCANDIT_LICENSE_KEY" ]; then
            echo "SCANDIT_LICENSE_KEY repository secret is missing."
            exit 1
          fi

          mkdir -p _site
          rsync -a --exclude='.git' --exclude='.github' --exclude='_site' ./ _site/

          python3 - <<'PY'
          import os
          from pathlib import Path

          app_file = Path("_site/barwa/index.html")
          if not app_file.exists():
              raise SystemExit("Could not find barwa/index.html in the site files.")

          html = app_file.read_text(encoding="utf-8")
          placeholder = "__SCANDIT_LICENSE_KEY__"
          key = os.environ["SCANDIT_LICENSE_KEY"]

          if placeholder not in html:
              raise SystemExit("Scandit licence placeholder was not found in barwa/index.html.")

          app_file.write_text(html.replace(placeholder, key), encoding="utf-8")
          print("Barwa app prepared successfully.")
          PY

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
